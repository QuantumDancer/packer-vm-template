# RHEL 9 Kickstart Configuration for Packer
# Based on anaconda-ks.cfg
#version=RHEL9

# Use text install instead of graphical
text

# Keyboard layouts
keyboard --xlayouts='de'
# System language
lang en_US.UTF-8

# Network information; --device=link picks the first NIC with a carrier, so
# the config survives interface renames (e.g. a machine type change).
network --bootproto=dhcp --device=link --ipv6=auto --activate
network --hostname=rhel-9-template

# System timezone
timezone Europe/Zurich --utc

# Use installation media
cdrom

# Disk configuration
ignoredisk --only-use=sda
# System bootloader configuration
bootloader --location=boot --boot-drive=sda

# Partition clearing information
clearpart --all --initlabel --drives=sda

# Disk partitioning information
part /boot/efi --fstype="efi" --ondisk=sda --size=600
part /boot --fstype="xfs" --ondisk=sda --size=1024
part pv.01 --fstype="lvmpv" --ondisk=sda --size=1 --grow
volgroup rhel --pesize=4096 pv.01
logvol / --fstype="xfs" --size=1 --name=root --vgname=rhel --grow

# System purpose
syspurpose --role="Red Hat Enterprise Linux Server" --sla="Self-Support" --usage="Development/Test"

# Root login is never used: provisioning goes through the packer user and
# cloned VMs get their user from cloud-init.
rootpw --lock

# User configuration - temporary user for Packer provisioning (will be deleted in template cleanup)
user --groups=wheel --name=packer --password=$6$laKg4bq1HLr4ug.R$koLuZOAC3gNP2HFMTzM23csqEhzrT8U4wzSVPQuUvL7G8ZLY9JcS66pWmgRhLxUBPDzsfLVVZ3ZDnlYOz/IIw1 --iscrypted --gecos="Packer"

# Disable firstboot (we want automated setup)
firstboot --disable

# SELinux configuration
selinux --enforcing

# Firewall configuration
firewall --enabled --service=ssh

# Do not configure the X Window System
skipx

# Reboot after installation
reboot

# Packages
%packages
@^minimal-environment
qemu-guest-agent
cloud-init
cloud-utils-growpart
%end

# Disable kdump: it permanently reserves RAM (crashkernel) on every clone,
# which is wasted on small ephemeral cloud-init VMs.
%addon com_redhat_kdump --disable
%end

# Post-installation script
%post --log=/root/ks-post.log
# Enable qemu-guest-agent
systemctl enable qemu-guest-agent

# Ensure SSH is enabled
systemctl enable sshd

# Allow sudo for wheel group without password (for Packer provisioning)
echo "%wheel ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/wheel
chmod 0440 /etc/sudoers.d/wheel

%end
